{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Customers</h2>
    <a href="{{ url_for('add_customer') }}" class="btn btn-success">+ Add Customer</a>
</div>
<table class="table table-bordered table-hover">
    <thead class="table-dark">
        <tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th>Actions</th></tr>
    </thead>
    <tbody>
        {% for c in customers %}
        <tr>
            <td>{{ c.name }}</td><td>{{ c.phone }}</td><td>{{ c.email or '-' }}</td><td>{{ c.address or '-' }}</td>
            <td>
                <a href="{{ url_for('add_repair_job') }}?customer_id={{ c.id }}" class="btn btn-sm btn-primary">New Job</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
