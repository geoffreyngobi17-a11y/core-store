{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Employees</h2>
    <a href="{{ url_for('add_employee') }}" class="btn btn-success">+ Add Employee</a>
</div>
<table class="table table-striped">
    <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Actions</th></tr></thead>
    <tbody>
        {% for u in users %}
        <tr><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{{ u.phone }}</td><td>{{ u.role }}</td>
            <td>{% if u.role != 'admin' %}<a href="{{ url_for('delete_employee', id=u.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('Delete?')">Delete</a>{% endif %}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
